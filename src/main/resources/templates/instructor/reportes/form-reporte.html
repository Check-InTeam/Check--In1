<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title th:text="${reporte.id != null} ? 'Editar Reporte' : 'Crear Reporte'">Crear Reporte</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/gh/alpinejs/alpine@v2.8.2/dist/alpine.min.js" defer></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
</head>
<body style="background-color:rgb(253,255,252)" x-data="{ openMenu: false }">

<header class="header">
    <div class="flex justify-between items-center px-4 py-2">
        <button @click="openMenu = !openMenu" class="focus:outline-none">
            <i class="bi bi-list text-2xl text-green-800"></i>
        </button>
        <div class="flex items-center relative" x-data="{ open: false }">
            <button @click="open = !open" class="flex items-center focus:outline-none">
                <img th:src="@{/img/instructor.gif}" class="h-10 w-10 rounded-full" alt="Perfil">
                <span class="ml-2 font-semibold"></span>
                <i class="bi bi-caret-down-fill ml-2"></i>
            </button>
            <div x-show="open" @click.away="open = false" class="menu-user">
                <ul>
                    <li><a th:href="@{/perfil}">Mi Perfil</a></li>
                    <li><a th:href="@{/logout}">Cerrar Sesión</a></li>
                </ul>
            </div>
        </div>
    </div>
</header>

<div class="flex">
    <!-- Sidebar -->
    <aside :class="openMenu ? 'sidebar sidebar-open' : 'sidebar sidebar-closed'">
        <br>
        <img th:src="@{/img/logocheckin.png}" alt="Logo" class="logo">
        <nav>
            <a th:href="@{/instructor/asistencia}" class="nav-link"><i class="bi bi-check2-square"></i> Asistencias</a>
            <a th:href="@{/instructor/carnet_digital}" class="nav-link"><i class="bi bi-card-image"></i> Carnet Digital</a>
            <a th:href="@{/instructor/registroEquipos}" class="nav-link"><i class="bi bi-hdd-stack"></i> Registro Equipos</a>
            <a th:href="@{/instructor/justificaciones}" class="nav-link"><i class="bi bi-chat-dots"></i> Justificaciones</a>
            <a th:href="@{/instructor/reportes}" class="nav-link"><i class="bi bi-bar-chart-line"></i> Reportes</a>
            <a th:href="@{/instructor/programming}" class="nav-link"><i class="bi bi-grid"></i> Programación</a>
        </nav>
        <div class="scroll-indicator">
            <i class="bi bi-arrow-down-short"></i>
        </div>
    </aside>

    <!-- Main -->
    <main class="flex-1 p-6 transition-all duration-300" :class="openMenu ? 'ml-0 md:ml-64' : 'ml-0'">
        <div class="dashboard-container">

            <div class="dashboard-header mb-4">
                <h2 class="text-2xl font-bold" th:text="${reporte.id != null} ? 'Editar Reporte' : 'Crear Reporte'"></h2>
            </div>

            <div class="max-w-3xl mx-auto bg-white p-6 rounded shadow">
                <form th:action="@{/instructor/reportes/guardar}" th:object="${reporte}" method="post" class="space-y-4">
                    <input type="hidden" th:field="*{id}"/>

                    <!-- Título -->
                    <div>
                        <label class="block mb-1 font-semibold">Título</label>
                        <input type="text" th:field="*{titulo}" class="w-full border border-gray-300 rounded px-3 py-2" required/>
                    </div>

                    <!-- Descripción -->
                    <div>
                        <label class="block mb-1 font-semibold">Descripción</label>
                        <textarea th:field="*{descripcion}" class="w-full border border-gray-300 rounded px-3 py-2" rows="4" required></textarea>
                    </div>

                    <!-- Tipo de Reporte -->
                    <div>
                        <label class="block mb-1 font-semibold">Tipo de Reporte</label>
                        <select th:field="*{tipo}" class="w-full border border-gray-300 rounded px-3 py-2">
                            <option th:each="tipo : ${tiposReporte}" th:value="${tipo.name()}" th:text="${tipo}"
                                    th:selected="${reporte.tipo == tipo}"></option>
                        </select>
                    </div>

                    <!-- Usuario (solo aprendices) -->
                    <div>
                        <label class="block mb-1 font-semibold">Aprendiz</label>
                        <select th:field="*{user}" class="w-full border border-gray-300 rounded px-3 py-2">
                            <option th:each="usuario : ${users}"
                                    th:value="${usuario.id}"
                                    th:text="${usuario.nombre + ' (' + ausenciasMap[usuario.id] + ' ausencias)'}"
                                    th:selected="${reporte.user != null and reporte.user.id == usuario.id}"></option>
                        </select>
                    </div>

                    <!-- Botones -->
                    <div class="flex justify-between">
                        <a href="/instructor/reportes" class="bg-gray-500 text-white px-4 py-2 rounded">Cancelar</a>
                        <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded">Guardar</button>
                    </div>
                </form>
            </div>

        </div>
    </main>
</div>

</body>
</html>
