<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <title>Detalle Justificación - Instructor</title>
  <link rel="stylesheet" th:href="@{/css/instructor.css}">
  <link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/gh/alpinejs/alpine@v2.8.2/dist/alpine.min.js" defer></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
</head>
<body x-data="{ openMenu: false }" class="bg-gray-100">

<header class="bg-white shadow p-4 flex justify-between items-center">
  <button @click="openMenu = !openMenu" class="focus:outline-none">
    <i class="bi bi-list text-2xl text-green-800"></i>
  </button>
  <div class="flex items-center relative" x-data="{ open: false }">
    <button @click="open = !open" class="flex items-center focus:outline-none">
      <img th:src="@{/img/instructor.gif}" class="h-10 w-10 rounded-full" alt="Perfil">
      <i class="bi bi-caret-down-fill ml-2"></i>
    </button>
    <div x-show="open" @click.away="open = false" class="absolute right-0 mt-2 w-40 bg-white shadow rounded">
      <ul>
        <li><a th:href="@{/perfil}" class="block px-4 py-2 hover:bg-gray-200">Mi Perfil</a></li>
        <li><a th:href="@{/logout}" class="block px-4 py-2 hover:bg-gray-200">Cerrar Sesión</a></li>
      </ul>
    </div>
  </div>
</header>

<div class="flex">
  <!-- Sidebar -->
  <aside :class="openMenu ? 'w-64' : 'w-16'" class="bg-white h-screen transition-all duration-300 shadow p-4">
    <img th:src="@{/img/logocheckin.png}" alt="Logo" class="mb-4 mx-auto w-32">
    <nav class="flex flex-col space-y-2">
      <a th:href="@{/instructor/asistencia}" class="nav-link flex items-center space-x-2 px-2 py-1 hover:bg-green-100 rounded">
        <i class="bi bi-check2-square"></i> <span>Asistencias</span>
      </a>
      <a th:href="@{/instructor/carnet_digital}" class="nav-link flex items-center space-x-2 px-2 py-1 hover:bg-green-100 rounded">
        <i class="bi bi-card-image"></i> <span>Carnet Digital</span>
      </a>
      <a th:href="@{/instructor/registroEquipos}" class="nav-link flex items-center space-x-2 px-2 py-1 hover:bg-green-100 rounded">
        <i class="bi bi-hdd-stack"></i> <span>Registro Equipos</span>
      </a>
      <a th:href="@{/instructor/justificaciones}" class="nav-link flex items-center space-x-2 px-2 py-1 bg-green-200 rounded">
        <i class="bi bi-chat-dots"></i> <span>Justificaciones</span>
      </a>
      <a th:href="@{/instructor/reportes}" class="nav-link flex items-center space-x-2 px-2 py-1 hover:bg-green-100 rounded">
        <i class="bi bi-bar-chart-line"></i> <span>Reportes</span>
      </a>
      <a th:href="@{/instructor/programming}" class="nav-link flex items-center space-x-2 px-2 py-1 hover:bg-green-100 rounded">
        <i class="bi bi-grid"></i> <span>Programación</span>
      </a>
    </nav>
  </aside>

  <!-- Contenido principal -->
  <main class="flex-1 p-6">
    <h2 class="text-2xl font-bold mb-4">Revisión de Justificación</h2>

    <div class="bg-white rounded shadow p-4">
      <p><strong>Aprendiz:</strong> <span th:text="${justificacion.user.nombre}"></span></p>
      <p><strong>Motivo:</strong> <span th:text="${justificacion.motivo}"></span></p>
      <p><strong>Fecha:</strong> <span th:text="${justificacion.fecha}"></span></p>
      <p><strong>Archivo:</strong>
        <span th:if="${justificacion.archivo != null}">
                    <a th:href="@{'/uploads/' + ${justificacion.archivo}}" target="_blank" class="text-blue-600 underline">Ver archivo</a>
                </span>
        <span th:if="${justificacion.archivo == null}">-</span>
      </p>

      <form th:action="@{'/instructor/justificaciones/' + ${justificacion.id} + '/actualizar'}" method="post" class="mt-4 space-y-4">
        <div>
          <label class="block font-semibold">Estado:</label>
          <select name="estado" class="border rounded px-2 py-1 w-full">
            <option th:each="e : ${T(com.Check_In.Check__In1.entity.EstadoJustificacion).values()}"
                    th:value="${e}" th:text="${e}"
                    th:selected="${e == justificacion.estado}">
            </option>
          </select>
        </div>

        <div>
          <label class="block font-semibold">Comentario:</label>
          <textarea name="comentario" rows="4" class="border rounded w-full px-2 py-1"
                    th:text="${justificacion.comentario}"></textarea>
        </div>

        <div class="flex space-x-2">
          <button type="submit" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
            Guardar
          </button>
          <a th:href="@{/instructor/justificaciones}" class="bg-gray-400 text-white px-4 py-2 rounded hover:bg-gray-500">
            Volver
          </a>
        </div>
      </form>
    </div>
  </main>
</div>

</body>
</html>
