<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Listado de Asistencias</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/gh/alpinejs/alpine@v2.8.2/dist/alpine.min.js" defer></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
</head>
<body style="background-color:rgb(253,255,252)" x-data="{ openMenu: false }">

<header class="header">
    <div class="flex justify-between items-center px-4 py-2">
        <button @click="openMenu = !openMenu" class="focus:outline-none">
            <i class="bi bi-list text-2xl text-green-800"></i>
        </button>
        <div class="flex items-center relative" x-data="{ open: false }">
            <button @click="open = !open" class="flex items-center focus:outline-none">
                <img th:src="@{/img/instructor.gif}" class="h-10 w-10 rounded-full" alt="Perfil">
                <i class="bi bi-caret-down-fill ml-2"></i>
            </button>
            <div x-show="open" @click.away="open = false" class="menu-user">
                <ul>
                    <li><a th:href="@{/perfil}">Mi Perfil</a></li>
                    <li><a th:href="@{/logout}">Cerrar Sesión</a></li>
                </ul>
            </div>
        </div>
    </div>
</header>

<div class="flex">
    <!-- Sidebar -->
    <aside :class="openMenu ? 'sidebar sidebar-open' : 'sidebar sidebar-closed'">
        <br>
        <img th:src="@{/img/logocheckin.png}" alt="Logo" class="logo">
        <nav>
            <a th:href="@{/administrador/aprendices}" class="nav-link"><i class="bi bi-people-fill"></i> Aprendices</a>
            <a th:href="@{/administrador/instructors}" class="nav-link"><i class="bi bi-person-badge-fill"></i> Instructores</a>
            <a th:href="@{/administrador/carnet_digital}" class="nav-link"><i class="bi bi-card-image"></i> Carnet Digital</a>
            <a th:href="@{/administrador/registroEquipos}" class="nav-link"><i class="bi bi-pc-display"></i> Registro Equipos</a>
            <a th:href="@{/administrador/justificaciones}" class="nav-link"><i class="bi bi-chat-dots"></i> Justificaciones</a>
            <a th:href="@{/administrador/reportes}" class="nav-link"><i class="bi bi-bar-chart-line"></i> Reportes</a>
            <a th:href="@{/administrador/programming}" class="nav-link"><i class="bi bi-grid"></i> Programacion</a>
            <a th:href="@{/administrador/asistencia}" class="nav-link"><i class="bi bi-grid"></i> Asistencias</a>
        </nav>
        <div class="scroll-indicator">
            <i class="bi bi-arrow-down-short"></i>
        </div>
    </aside>


    <main class="flex-1 p-6 transition-all duration-300" :class="openMenu ? 'ml-0 md:ml-64' : 'ml-0'">

        <div class="dashboard-container">

            <!-- Cabecera -->
            <div class="dashboard-header">
                <h2 class="dashboard-title">Crear Asistencia</h2>

            </div>

            <!-- Formulario -->
            <form th:action="@{/administrador/asistencia/crear}" th:object="${asistencia}" method="post" class="asistencia-form">

                <div class="form-group">
                    <label for="user">Usuario</label>
                    <select th:field="*{user.id}" id="user" class="form-control">
                        <option th:each="usuario : ${usuarios}"
                                th:value="${usuario.id}"
                                th:text="${usuario.nombre} + ' - ' + ${usuario.role.nombre}">
                                </option>
                    </select>
                    <p th:if="${#fields.hasErrors('user')}" th:errors="*{user}" class="text-red-600"></p>
                </div>

                <div class="form-group">
                    <label for="fecha">Fecha</label>
                    <input type="date" th:field="*{fecha}" id="fecha" class="form-control">
                    <p th:if="${#fields.hasErrors('fecha')}" th:errors="*{fecha}" class="text-red-600"></p>
                </div>

                <div class="form-group">
                    <label for="horaEntrada">Hora Entrada</label>
                    <input type="time" th:field="*{horaEntrada}" id="horaEntrada" class="form-control">
                    <p th:if="${#fields.hasErrors('horaEntrada')}" th:errors="*{horaEntrada}" class="text-red-600"></p>
                </div>

                <div class="form-group">
                    <label for="estado">Estado</label>
                    <select th:field="*{estado}" id="estado" class="form-control">
                        <option value="PRESENTE">Presente</option>
                        <option value="AUSENTE">Ausente</option>
                        <option value="TARDE">Tarde</option>
                    </select>
                    <p th:if="${#fields.hasErrors('estado')}" th:errors="*{estado}" class="text-red-600"></p>
                </div>

                <div class="form-group">
                    <label for="observaciones">Observaciones</label>
                    <textarea th:field="*{observaciones}" id="observaciones" class="form-control" rows="3"></textarea>
                    <p th:if="${#fields.hasErrors('observaciones')}" th:errors="*{observaciones}" class="text-red-600"></p>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-submit">
                        <i class="bi bi-check-circle mr-1"></i> Guardar
                    </button>

                    <a th:href="@{/administrador/asistencia}" class="btn-back">
                        <i class="bi bi-arrow-left-circle mr-1"></i> Volver al Listado
                    </a>
                </div>

            </form>

        </div>

    </main>



</div>

</body>
</html>
