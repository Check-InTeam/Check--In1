<!DOCTYPE html>
<html lang="en">
<div th:if="${mensajeExito}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4">
    <span th:text="${mensajeExito}"></span>
</div>
<form th:action="@{'/eliminar/' + ${aprendiz.id}}" method="post" onsubmit="return confirm('¿Estás seguro de eliminar este aprendiz?');">
    <input type="hidden" name="_method" value="delete" />
    <button type="submit" class="text-red-600 hover:text-red-800">Eliminar</button>
</form>

</html>
