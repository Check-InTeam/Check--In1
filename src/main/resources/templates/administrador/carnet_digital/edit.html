<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <title>Carnet Digital</title>
  <link rel="stylesheet" th:href="@{/css/admin.css}">

  <!-- Tailwind y Alpine -->
  <link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/gh/alpinejs/alpine@v2.8.2/dist/alpine.min.js" defer></script>

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
</head>
<body x-data="{ openMenu: false }">

<header class="header">
  <div class="flex justify-between items-center px-4 py-2">
    <button @click="openMenu = !openMenu" class="focus:outline-none">
      <i class="bi bi-list text-2xl text-green-800"></i>
    </button>
    <div class="flex items-center relative" x-data="{ open: false }">
      <button @click="open = !open" class="flex items-center focus:outline-none">
        <img th:src="@{/img/instructor.gif}" class="h-10 w-10 rounded-full" alt="Perfil">
        <i class="bi bi-caret-down-fill ml-2"></i>
      </button>
      <div x-show="open" @click.away="open = false" class="menu-user">
        <ul>
          <li><a th:href="@{/perfil}">Mi Perfil</a></li>
          <li><a th:href="@{/logout}">Cerrar Sesión</a></li>
        </ul>
      </div>
    </div>
  </div>
</header>

<div class="flex">
  <!-- Sidebar -->
  <aside :class="openMenu ? 'sidebar sidebar-open' : 'sidebar sidebar-closed'">
    <img th:src="@{/img/logocheckin.png}" alt="Logo" class="logo">
    <nav>
      <a th:href="@{/administrador/aprendices}" class="nav-link"><i class="bi bi-people-fill"></i> Aprendices</a>
      <a th:href="@{/administrador/instructors}" class="nav-link"><i class="bi bi-person-badge-fill"></i> Instructores</a>
      <a th:href="@{/administrador/carnet_digital}" class="nav-link"><i class="bi bi-card-image"></i> Carnet Digital</a>
      <a th:href="@{/administrador/registroEquipos}" class="nav-link"><i class="bi bi-hdd-stack"></i> Registro Equipos</a>
      <a th:href="@{/administrador/justificaciones}" class="nav-link"><i class="bi bi-chat-dots"></i> Justificaciones</a>
      <a th:href="@{/administrador/reportes}" class="nav-link"><i class="bi bi-bar-chart-line"></i> Reportes</a>
      <a th:href="@{/administrador/programming}" class="nav-link"><i class="bi bi-grid"></i> Programacion</a>
      <a th:href="@{/administrador/asistencia}" class="nav-link"><i class="bi bi-check2-square"></i> Asistencia</a>
    </nav>
    <div class="scroll-indicator">
      <i class="bi bi-arrow-down-short"></i>
    </div>
  </aside>

  <main class="flex-1 p-6 transition-all duration-300" :class="openMenu ? 'ml-0 md:ml-64' : 'ml-0'">
  <div class="edit-container">

    <h2 class="edit-title">Editar Carnet</h2>

    <form th:action="@{'/administrador/carnet_digital/update/' + ${carnet.id}}"
          method="post" enctype="multipart/form-data">

      <label class="form-label">Nombre Completo:</label>
      <input type="text" name="nombreCompleto" th:value="${carnet.nombreCompleto}"
             class="form-input" required />

      <label class="form-label">Número de Identificación:</label>
      <input type="text" name="numeroDeIdentificacion" th:value="${carnet.numeroDeIdentificacion}"
             class="form-input" required />

      <label class="form-label">Ficha:</label>
      <input type="text" name="ficha" th:value="${carnet.ficha}" class="form-input" />

      <label class="form-label">Programa:</label>
      <input type="text" name="programa" th:value="${carnet.programa}" class="form-input" />

      <label class="form-label">Jornada:</label>
      <input type="text" name="jornada" th:value="${carnet.jornada}" class="form-input" />

      <label class="form-label">Foto Actual:</label>
      <div class="current-photo">
        <img th:if="${carnet.foto != null}"
             th:src="@{'/administrador/carnet_digital/foto/' + ${carnet.id}}"
             alt="Foto del carnet" class="photo-preview" />
        <p th:if="${carnet.foto == null}" class="no-photo">No hay foto cargada.</p>
      </div>

      <label class="form-label">Subir nueva foto:</label>
      <input type="file" name="file" accept="image/*" class="file-input" />

      <button type="submit" class="btn-save">Guardar Cambios</button>
    </form>

    <div class="back-link">
      <a th:href="@{/administrador/carnet_digital}">← Volver a la lista</a>
    </div>
  </div>
  </main>
</div>

</body>
</html>
