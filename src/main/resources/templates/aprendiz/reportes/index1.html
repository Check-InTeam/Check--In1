<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Aprendiz</title>
  <link rel="stylesheet" th:href="@{/css/aprendiz.css}">

  <link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/gh/alpinejs/alpine@v2.8.2/dist/alpine.min.js" defer></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
</head>
<body style="background-color:rgb(253,255,252)" x-data="{ openMenu: false }">

<header class="header">
  <div class="flex justify-between items-center px-4 py-2">
    <button @click="openMenu = !openMenu" class="focus:outline-none">
      <i class="bi bi-list text-2xl text-green-800"></i>
    </button>
    <div class="flex items-center relative" x-data="{ open: false }">
      <button @click="open = !open" class="flex items-center focus:outline-none">
        <img th:src="@{/img/instructor.gif}" class="h-10 w-10 rounded-full" alt="Perfil">
        <span class="ml-2 font-semibold" th:text="${user.nombre}"></span>
        <i class="bi bi-caret-down-fill ml-2"></i>
      </button>
      <div x-show="open" @click.away="open = false" class="menu-user">
        <ul>
          <li><a href="#" th:href="@{/perfil}">Mi Perfil</a></li>
          <li><a href="#" th:href="@{/logout}">Cerrar Sesión</a></li>
        </ul>
      </div>
    </div>
  </div>
</header>

<div class="flex">
  <!-- Sidebar -->
  <aside :class="openMenu ? 'sidebar sidebar-open' : 'sidebar sidebar-closed'">
    <br>
    <img th:src="@{/img/logocheckin.png}" alt="Logo" class="logo">
    <nav>
      <a th:href="@{/aprendiz/carnet_digital}" class="nav-link"><i class="bi bi-card-image"></i> Carnet Digital</a>
      <a th:href="@{/aprendiz/registroEquipos}" class="nav-link"><i class="bi bi-hdd-stack"></i> Registro Equipos</a>
      <a th:href="@{/aprendiz/justificaciones}" class="nav-link"><i class="bi bi-chat-dots"></i> Justificaciones</a>
      <a th:href="@{/aprendiz/reportes}" class="nav-link"><i class="bi bi-bar-chart-line"></i> Reportes</a>
      <a th:href="@{/aprendiz/programming}" class="nav-link"><i class="bi bi-grid"></i> Programacion</a>
    </nav>
    <div class="scroll-indicator">
      <i class="bi bi-arrow-down-short"></i>
    </div>
  </aside>

  <!-- Main -->
  <main class="flex-1 p-6 transition-all duration-300" :class="openMenu ? 'ml-0 md:ml-64' : 'ml-0'">
    <div class="bg-white shadow-lg rounded-lg p-6 text-center">
      <h2 class="text-2xl font-bold text-gray-700 mb-4">Estado de mis Reportes</h2>

      <!-- Mensaje dinámico -->
      <p class="text-lg mb-6 font-medium" th:text="${mensaje}"></p>

      <!-- Tabla de reportes -->
      <div th:if="${reportes != null}">
        <h3 class="text-xl font-semibold mb-2">Tus Reportes</h3>
        <table class="min-w-full divide-y divide-gray-200 mb-4">
          <thead>
          <tr>
            <th class="px-4 py-2 text-left">Título</th>
            <th class="px-4 py-2 text-left">Descripción</th>
            <th class="px-4 py-2 text-left">Fecha</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="reporte : ${reportes}">
            <td class="px-4 py-2" th:text="${reporte.titulo}"></td>
            <td class="px-4 py-2" th:text="${reporte.descripcion}"></td>
            <td class="px-4 py-2" th:text="${#temporals.format(reporte.fechaCreacion, 'dd/MM/yyyy')}"></td>
          </tr>
          </tbody>
        </table>
      </div>

      <!-- Gráfica circular -->
      <div class="flex flex-col items-center max-w-xs mx-auto">
        <canvas id="fallasChart"
                width="250" height="250"
                style="width:250px; height:250px;"
                th:attr="data-fallas=${fallas}">
        </canvas>

        <div class="flex justify-center mt-4">
          <div class="flex items-center mr-4">
            <div class="w-4 h-4 bg-red-600 mr-2"></div>Fallas
          </div>
          <div class="flex items-center">
            <div class="w-4 h-4 bg-green-200 mr-2"></div>Restante
          </div>
        </div>
      </div>

    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script th:src="@{/js/grafica.js}"></script>


</body>
</html>
