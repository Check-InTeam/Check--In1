<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Aprendiz Programación</title>
    <link rel="stylesheet" th:href="@{/css/aprendiz.css}">
    <link rel="stylesheet" th:href="@{/css/programacion.css}">

    <!-- Tailwind y Alpine -->
    <link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/gh/alpinejs/alpine@v2.8.2/dist/alpine.min.js" defer></script>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
</head>
<body x-data="{ openMenu: false }">

<header class="header">
    <div class="flex justify-between items-center px-4 py-2">
        <button @click="openMenu = !openMenu" class="focus:outline-none">
            <i class="bi bi-list text-2xl text-green-800"></i>
        </button>
        <div class="flex items-center relative" x-data="{ open: false }">
            <button @click="open = !open" class="flex items-center focus:outline-none">
                <img th:src="@{/img/instructor.gif}" class="h-10 w-10 rounded-full" alt="Perfil">
                <i class="bi bi-caret-down-fill ml-2"></i>
            </button>
            <div x-show="open" @click.away="open = false" class="menu-user">
                <ul>
                    <li><a th:href="@{/perfil}">Mi Perfil</a></li>
                    <li><a th:href="@{/logout}">Cerrar Sesión</a></li>
                </ul>
            </div>
        </div>
    </div>
</header>

<div class="flex">
    <!-- Sidebar -->
    <aside :class="openMenu ? 'sidebar sidebar-open' : 'sidebar sidebar-closed'">
        <img th:src="@{/img/logocheckin.png}" alt="Logo" class="logo">
        <nav>
            <a th:href="@{/aprendiz/carnet_digital}" class="nav-link"><i class="bi bi-card-image"></i> Carnet Digital</a>
            <a th:href="@{/aprendiz/registroEquipos}" class="nav-link"><i class="bi bi-hdd-stack"></i> Registro Equipos</a>
            <a th:href="@{/aprendiz/justificaciones}" class="nav-link"><i class="bi bi-chat-dots"></i> Justificaciones</a>
            <a th:href="@{/aprendiz/reportes}" class="nav-link"><i class="bi bi-bar-chart-line"></i> Reportes</a>
            <a th:href="@{/aprendiz/programming}" class="nav-link"><i class="bi bi-grid"></i> Programación</a>
        </nav>
        <div class="scroll-indicator">
            <i class="bi bi-arrow-down-short"></i>
        </div>
    </aside>

    <!-- Contenido principal -->
    <main class="flex-1 p-6 transition-all duration-300" :class="openMenu ? 'ml-0 md:ml-64' : 'ml-0'">
    <div class="programacion-container">

        <h2 class="titulo-programacion">Programación 2025</h2>

        <!-- Formulario de filtros -->
        <form th:action="@{/aprendiz/programming}" method="get"
              class="formulario-filtros">
            <input type="text" name="nombreAsignatura" placeholder="Buscar asignatura"
                   th:value="${param.nombreAsignatura}" class="campo-filtro"/>

            <input type="text" name="ficha" placeholder="Buscar ficha"
                   th:value="${param.ficha}" class="campo-filtro"/>

            <button type="submit" class="btn-filtrar">Filtrar</button>
            <a th:href="@{/aprendiz/programming}" class="btn-limpiar">Limpiar</a>
        </form>

        <!-- Tabla de resultados -->
        <table class="tabla-programacion">
            <thead>
            <tr>
                <th>Nombre de Asignatura</th>
                <th>Descripción</th>
                <th>Ficha</th>
                <th>Fecha de Inicio</th>
                <th>Fecha Fin</th>
                <th>Hora de Inicio</th>
                <th>Hora Final</th>
                <th>Ambiente</th>
                <th>Instructor</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="programacion : ${programming}">
                <td th:text="${programacion.nombreAsignatura}"></td>
                <td th:text="${programacion.descripcion}"></td>
                <td th:text="${programacion.ficha}"></td>
                <td th:text="${programacion.fechaInicio}"></td>
                <td th:text="${programacion.fechaFin}"></td>
                <td th:text="${programacion.horaInicio}"></td>
                <td th:text="${programacion.horaFin}"></td>
                <td th:text="${programacion.ambiente}"></td>
                <td th:text="${programacion.user.nombre}"></td>
                <td class="acciones">
                    <div class="botones-acciones">
                        <a th:href="@{/aprendiz/programming/show/{id}(id=${programacion.id})}" class="link-ver">Ver</a>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    </main>
</div>

</body>
</html>
