<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear Carnet Digital</title>
    <link rel="stylesheet" th:href="@{/css/aprendiz.css}">

    <!-- Tailwind y Alpine -->
    <link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/gh/alpinejs/alpine@v2.8.2/dist/alpine.min.js" defer></script>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
</head>
<body x-data="{ openMenu: false }">

<header class="header">
    <div class="flex justify-between items-center px-4 py-2">
        <button @click="openMenu = !openMenu" class="focus:outline-none">
            <i class="bi bi-list text-2xl text-green-800"></i>
        </button>
        <div class="flex items-center relative" x-data="{ open: false }">
            <button @click="open = !open" class="flex items-center focus:outline-none">
                <img th:src="@{/img/instructor.gif}" class="h-10 w-10 rounded-full" alt="Perfil">
                <i class="bi bi-caret-down-fill ml-2"></i>
            </button>
            <div x-show="open" @click.away="open = false" class="menu-user">
                <ul>
                    <li><a th:href="@{/perfil}">Mi Perfil</a></li>
                    <li><a th:href="@{/logout}">Cerrar Sesión</a></li>
                </ul>
            </div>
        </div>
    </div>
</header>

<div class="flex">
    <!-- Sidebar -->
    <aside :class="openMenu ? 'sidebar sidebar-open' : 'sidebar sidebar-closed'">
        <img th:src="@{/img/logocheckin.png}" alt="Logo" class="logo">
        <nav>
            <a th:href="@{/aprendiz/carnet_digital}" class="nav-link"><i class="bi bi-card-image"></i> Carnet Digital</a>
            <a th:href="@{/aprendiz/registroEquipos}" class="nav-link"><i class="bi bi-hdd-stack"></i> Registro Equipos</a>
            <a th:href="@{/aprendiz/justificaciones}" class="nav-link"><i class="bi bi-chat-dots"></i> Justificaciones</a>
            <a th:href="@{/aprendiz/reportes}" class="nav-link"><i class="bi bi-bar-chart-line"></i> Reportes</a>
            <a th:href="@{/aprendiz/programming}" class="nav-link"><i class="bi bi-grid"></i> Programacion</a>
        </nav>
        <div class="scroll-indicator">
            <i class="bi bi-arrow-down-short"></i>
        </div>
    </aside>

    <!-- Contenido -->
    <main class="flex-1 p-6 transition-all duration-300"
          :class="openMenu ? 'ml-0 md:ml-64' : 'ml-0'">

        <div class="form-container">
        <h1 class="form-title">Crear Carnet Digital</h1>

        <form th:action="@{/aprendiz/carnet_digital/guardar}" method="post" enctype="multipart/form-data" class="formulario">
            <div class="form-group">
                <label>Nombre Completo</label>
                <input type="text" name="nombreCompleto" required>
            </div>
            <div class="form-group">
                <label>Número de Identificación</label>
                <input type="text" name="numeroDeIdentificacion" required>
            </div>
            <div class="form-group">
                <label>Ficha</label>
                <input type="text" name="ficha" required>
            </div>
            <div class="form-group">
                <label>Programa</label>
                <input type="text" name="programa" required>
            </div>
            <div class="form-group">
                <label>Jornada</label>
                <select name="jornada" required>
                    <option value="">Seleccione una opción</option>
                    <option value="Diurna">Diurna</option>
                    <option value="Mixta">Mixta</option>
                    <option value="Nocturna">Nocturna</option>
                    <option value="Fines De Semana">Fines de Semana</option>
                </select>
            </div>

            <div class="form-actions">
                <button type="submit">Guardar</button>
                <a th:href="@{/aprendiz/carnet_digital}">Cancelar</a>
            </div>
        </form>
        </div>
    </main>
</div>
</body>
</html>
